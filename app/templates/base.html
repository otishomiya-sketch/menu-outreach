<!doctype html>
<html lang="ja">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Menu Photo Pro 営業</title>
<style>
:root{--bg:#f7f6f3;--fg:#1d1d1f;--mut:#6b6b70;--card:#fff;--line:#e4e2dd;--acc:#c2410c;--ok:#15803d;--ng:#b91c1c}
@media (prefers-color-scheme:dark){:root{--bg:#161616;--fg:#eee;--mut:#9a9a9f;--card:#222;--line:#333;--acc:#fb923c;--ok:#4ade80;--ng:#f87171}}
*{box-sizing:border-box}
body{margin:0;background:var(--bg);color:var(--fg);font:15px/1.6 -apple-system,"Hiragino Sans",sans-serif}
nav{display:flex;gap:16px;padding:12px 16px;border-bottom:1px solid var(--line);flex-wrap:wrap}
nav a{color:var(--fg);text-decoration:none;font-weight:600}
nav a.brand{color:var(--acc)}
main{max-width:1100px;margin:0 auto;padding:16px}
.card{background:var(--card);border:1px solid var(--line);border-radius:10px;padding:16px;margin-bottom:16px}
.card h2,.card h3{margin-top:0}
.grid{display:grid;grid-template-columns:repeat(auto-fit,minmax(160px,1fr));gap:12px}
.num{font-size:28px;font-weight:700}
.mut{color:var(--mut);font-size:13px}
.warn{border-color:var(--ng)}
table{width:100%;border-collapse:collapse;font-size:14px}
td,th{padding:6px 8px;border-bottom:1px solid var(--line);text-align:left;vertical-align:top}
.tw{overflow-x:auto}
button,.btn{background:var(--acc);color:#fff;border:0;border-radius:8px;padding:9px 14px;font-weight:600;cursor:pointer;text-decoration:none;display:inline-block;font-size:14px}
button.sub,.btn.sub{background:transparent;color:var(--fg);border:1px solid var(--line)}
button.ok{background:var(--ok)}
button.ng{background:var(--ng)}
button:disabled{opacity:.5;cursor:default}
textarea{width:100%;min-height:340px;font-family:inherit;font-size:14px;line-height:1.6;padding:10px;border:1px solid var(--line);border-radius:8px;background:var(--bg);color:var(--fg)}
.thumbs{display:flex;gap:6px;flex-wrap:wrap;margin-top:10px}
.thumbs img{width:96px;height:96px;object-fit:cover;border-radius:6px}
.row{display:flex;gap:8px;flex-wrap:wrap;align-items:center}
.between{justify-content:space-between}
.pill{font-size:12px;padding:2px 8px;border-radius:99px;border:1px solid var(--line)}
.demo{margin-left:auto;border-color:var(--acc);color:var(--acc)}
input,select{padding:7px;border:1px solid var(--line);border-radius:6px;background:var(--card);color:var(--fg)}
pre{white-space:pre-wrap;font-size:13px}
</style>
{% block head %}{% endblock %}
</head>
<body>
<nav>
  <a class="brand" href="/">Menu Photo Pro 営業</a>
  <a href="/queue/instagram">Instagram DM</a>
  <a href="/queue/line">LINE</a>
  <a href="/mail">メール</a>
  <a href="/leads">店舗リスト</a>
  <a href="/improve">改善</a>
  <a href="/jobs">実行</a>
  {% if is_demo %}<span class="pill demo">デモデータ表示中（架空の店舗・実際には送信されません）</span>{% endif %}
</nav>
<main>{% block content %}{% endblock %}</main>
</body>
</html>
