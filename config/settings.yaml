# Menu Photo Pro 営業アプリ 設定
# APIキー・パスワード類は .env（本番は Railway の環境変数）に書く。このファイルには書かない

sender:
  # 本番では Railway の環境変数 SENDER_COMPANY / SENDER_ADDRESS / SENDER_EMAIL / SENDER_CONTACT が優先される。
  # リポジトリは公開なので、住所などはここに書かず環境変数に置く。
  person: 大宮        # 本文の「オーティスの大宮です」
  company: ""         # メール送信に必須（特定電子メール法の表示義務）
  address: ""         # メール送信に必須
  email: ""           # 送信元アドレス。SMTP_USER と同じにする
  contact: ""         # 任意: 電話番号 または URL

service:
  trial_url: "https://7ayyryczawpyuggappqsqqd.streamlit.app/?openExternalBrowser=1"
  # true にすると URL に &ref=<店舗コード> を付ける。Menu Photo Pro 側で st.query_params["ref"] を
  # 記録すれば「どの店が・どの文面で」無料体験を始めたか自動で分かる
  append_ref: true

# ---- ①集める（Googleマップ / Apify） ----
collect:
  keywords: [居酒屋, カフェ, ラーメン, 焼肉, イタリアン, 和食, 中華料理, 洋食, 定食, ベーカリー, スイーツ, バー]
  # 「実行」画面の①収集の初期値（環境変数 COLLECT_AREAS で上書き）
  areas: [東京都渋谷区, 大阪市北区]
  limit_per_search: 40
  # 毎朝の自動収集: nationwide = 47都道府県 × keywords を順番に / areas = 上の areas だけ
  auto_scope: nationwide
  auto_searches_per_day: 5   # 1日に回す「エリア×業種」の数（環境変数 AUTO_SEARCHES_PER_DAY で上書き）

# ---- ②見込み度スコア ----
scoring:
  target_posts_30d: 8        # 30日にこの本数投稿していれば「更新頻繁」とみなす（満点）
  stale_after_days: 14       # 最終投稿がこれより古いと活発度を減点
  min_activity: 0.35         # これ未満の店は後回し（スコア×0.3）
  images_per_shop: 9         # 写真品質を測る直近投稿の枚数
  weights: {activity: 0.45, weakness: 0.45, reach: 0.10}
  use_vision: false          # true で Claude が写真を見て「素人っぽさ」を採点（精度↑・費用↑）
  vision_model: claude-haiku-4-5-20251001

# ---- ③送る ----
channels:
  priority: [instagram, email, line]   # 1店につき、まずこの順で使えるチャネル1つだけに送る
  followup_after_days: 14              # 反応がなければ、別チャネルで1回だけ再アプローチ
  max_touches_per_shop: 2
  daily_limit:
    instagram: 25    # 手動送信。アカウント保護のため 30 を超えないこと
    line: 20         # 手動送信
    email: 100       # 自動送信
  email_interval_sec: [40, 90]         # メール1通ごとの待ち時間（ランダム）
  email_live: false                    # false の間はメールを実際には送らない（ドライラン）

# ---- ④自己改善 ----
improve:
  min_sends_to_judge: 150     # 1文面あたりこの件数送るまでは勝ち負けを判定しない
  retire_if_p_best_below: 0.03
  proposal_model: claude-sonnet-5-5
