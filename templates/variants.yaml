# 営業文面（初期値）。`python cli.py init` で DB に取り込まれ、以後はダッシュボードの「改善」画面で管理します。
#
# 使える差し込み:
#   {greeting}      … 「〇〇 〇〇さま」または「〇〇 ご担当者さま」（オーナー名が取れないとき）
#   {shop_name}     … 店名
#   {trial_url}     … お試しURL（設定で &ref=店舗コード を自動付与）
#   {reply_channel} … 「このDM」「このLINE」「このメールへのご返信」などチャネルごとに自動で入る
#   {sender_person} … 設定の sender.person
#   {found_via}     … Instagram がある店は「Instagram」、ない店は「お店の情報」
#
# status: active = 配信に使う / proposed = 承認待ち（ダッシュボードで承認すると active）

variants:
  - name: A-詳しく説明
    status: active
    rationale: >
      しっかり説明する版（主にメール向け）。2005年からのフリーペーパーでの飲食店撮影の実績を冒頭で伝え、カメラアプリ・画像AIとの違いと経済効果（1枚約200円）、使える場面を示す。2026-10-02 に実績を追加。
    subject: "【無料お試し】フリーペーパーで飲食店を撮り続けた会社がつくった、メニュー写真アプリ（{shop_name}さま）"
    body: |
      {greeting}

      突然のご連絡失礼いたします。株式会社オーティス『Menu Photo Pro』担当です。
      {shop_name}さんの{found_via}を拝見し、ご連絡しました。

      当社は2005年からフリーペーパーを発行し、毎月150店舗以上の飲食店の広告写真を撮影してきました。お客さまは写真でお店を選ぶこと、そして実物と違う写真は決して使ってはいけないことを、現場で学んできました。

      そのノウハウを、いまのスマホとAIに組み込んだのが「Menu Photo Pro」です。スマホで撮った料理写真を、プロが撮ったようなメニュー写真に仕上げます。

      ▼インストール・会員登録なしで、10枚まで無料でお試しいただけます
      {trial_url}

      【カメラアプリや画像AIとの違い】
      ・カメラアプリは色味が変わるだけで、生活感のある背景はそのまま
      ・ChatGPTなどの画像AIは、料理や量が別物に描き変わることも
      ・Menu Photo Proは料理・量・盛り付けはそのままに、光・色・背景だけを整えます。加工前と見比べて確認できます

      【経済効果】
      ・カメラマンに頼むと一般的に1回数万円。月1,980円（税別）で毎月10枚、1枚約200円
      ・照明も機材も不要。営業の合間にスマホ1台で数分
      ・メニュー、SNS、ホームページ、デリバリーアプリにすぐ使えます

      使ってみたご感想も、{reply_channel}で気軽にお聞かせください。
      どうぞよろしくお願いいたします。

  - name: B-短め
    status: proposed
    rationale: >
      短くまとめた版（主にDM向け）。実績（2005年から毎月150店舗以上の飲食店を撮影）と、実物を変えない仕上げ・1枚約200円を短く伝える。2026-10-02 に実績を追加。
    subject: "フリーペーパーで飲食店を撮り続けた会社がつくった、メニュー写真アプリ（{shop_name}さま）"
    body: |
      {greeting}

      突然のご連絡失礼いたします。株式会社オーティス『Menu Photo Pro』担当です。
      {shop_name}さんの{found_via}を拝見して、ご連絡しました。

      当社は2005年からフリーペーパーを発行し、毎月150店舗以上の飲食店の広告写真を撮影してきました。写真の大切さと、実物と違う写真は決して使ってはいけないことを、現場で学んできました。

      そのノウハウを、いまのスマホとAIに組み込んだのが「Menu Photo Pro」です。料理・量・盛り付けはそのままに、光・色・背景だけを整えて、プロが撮ったようなメニュー写真に仕上げます。

      カメラマンに頼むと1回数万円かかる写真が、月1,980円（税別）・1枚約200円。スマホ1台で数分で作れます。

      ▼インストール・会員登録なしで、10枚まで無料でお試しいただけます
      {trial_url}

      ご感想も、{reply_channel}で気軽にお聞かせください。
