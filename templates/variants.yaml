# 営業文面（初期値）。`python cli.py init` で DB に取り込まれ、以後はダッシュボードの「改善」画面で管理します。
#
# 使える差し込み:
#   {greeting}      … 「〇〇 〇〇さま」または「〇〇 ご担当者さま」（オーナー名が取れないとき）
#   {shop_name}     … 店名
#   {trial_url}     … お試しURL（設定で &ref=店舗コード を自動付与）
#   {reply_channel} … 「このDM」「このLINE」「このメールへのご返信」などチャネルごとに自動で入る
#   {sender_person} … 設定の sender.person
#   {found_via}     … Instagram がある店は「Instagram」、ない店は「お店の情報」
#
# status: active = 配信に使う / proposed = 承認待ち（ダッシュボードで承認すると active）

variants:
  - name: A-原文
    status: active
    rationale: >
      しっかり説明する版（主にメール向け）。カメラアプリ・ChatGPTなどの画像AIとの違い（料理を変えずに光・色・背景だけ整える、
      指示文不要、加工前と見比べられる）と、経済効果（カメラマン1回数万円 → 月1,980円・1枚約200円）を伝える。
      2026-10-01 に大宮さんの原文から書き換え（名前は成績を引き継ぐため A-原文 のまま）。
    subject: "【無料お試し】カメラマンなしで、スマホの料理写真をメニュー写真に｜Menu Photo Pro（{shop_name}さま）"
    body: |
      {greeting}

      突然のご連絡失礼いたします。株式会社オーティス『Menu Photo Pro』担当です。
      {shop_name}さんの{found_via}を拝見し、ご連絡しました。

      スマホで撮った料理写真を、プロのカメラマンが撮ったようなメニュー写真に仕上げるアプリ「Menu Photo Pro」をご案内させてください。

      ▼インストール・会員登録なしで、10枚まで無料でお試しいただけます
      {trial_url}

      【カメラアプリやChatGPTとの違い】
      ・カメラアプリの加工は、写真全体の明るさや色味が変わるだけで、生活感のある背景や照明のムラはそのまま残ります
      ・ChatGPTなどの画像AIは、毎回指示文を考える必要があり、料理や量が別物に描き変わってしまうこともあります
      ・Menu Photo Proは、最新の画像AIを「メニュー写真専用」に調整しています。料理・量・盛り付けは変えずに、光・色・背景・構図だけを整えるので、指示文は不要。加工前と並べて見比べられるので、実物と違う写真を使ってしまう心配もありません

      【お店にとっての経済効果】
      ・カメラマンに撮影を頼むと、一般的に1回数万円。Menu Photo Proなら月1,980円（税別）で毎月10枚、1枚あたり約200円です
      ・照明も機材もいりません。営業の合間に、スマホ1台で数分で完成します
      ・新メニューや季節限定、本日のおすすめの告知、Instagram・LINE・デリバリーアプリの写真の差し替えに、その日のうちに使えます
      ・仕上がった写真から、リールやストーリー用の動画も作れます（追加料金なし）

      最初にお店の名前を入れるだけで、10枚まで無料でお使いいただけます。
      使ってみたご感想も、{reply_channel}で気軽にお聞かせください。
      どうぞよろしくお願いいたします。

  - name: B-初回あいさつ・短め
    status: proposed
    rationale: >
      短くまとめた版（主にDM・LINE向け）。違いと経済効果を2文に凝縮し、スマホで読み切れる長さで返信率が上がるかをAと比べる。
      2026-10-01 に書き換え（名前は成績を引き継ぐため変えていない）。
    subject: "カメラマンなしで、料理写真をメニュー写真に（{shop_name}さま・無料お試しのご案内）"
    body: |
      {greeting}

      突然のご連絡失礼いたします。株式会社オーティス『Menu Photo Pro』担当です。
      {shop_name}さんの{found_via}を拝見して、ご連絡しました。

      スマホの料理写真を、プロが撮ったようなメニュー写真に仕上げるアプリです。
      カメラアプリのように色味を変えるだけでも、画像AIのように料理まで描き変えてしまうのでもなく、料理・量・盛り付けはそのままに、光・色・背景だけを整えます。

      カメラマンに頼むと1回数万円かかる写真が、月1,980円（税別）・1枚約200円。スマホ1台で数分で作れます。

      ▼インストール・会員登録なしで、10枚まで無料でお試しいただけます
      {trial_url}

      ご感想も、{reply_channel}で気軽にお聞かせください。
