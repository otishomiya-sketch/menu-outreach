# 営業文面（初期値）。`python cli.py init` で DB に取り込まれ、以後はダッシュボードの「改善」画面で管理します。
#
# 使える差し込み:
#   {greeting}      … 「〇〇 〇〇さま」または「〇〇 ご担当者さま」（オーナー名が取れないとき）
#   {shop_name}     … 店名
#   {trial_url}     … お試しURL（設定で &ref=店舗コード を自動付与）
#   {reply_channel} … 「このDM」「このLINE」「このメールへのご返信」などチャネルごとに自動で入る
#   {sender_person} … 設定の sender.person
#   {found_via}     … Instagram がある店は「Instagram」、ない店は「お店の情報」
#
# status: active = 配信に使う / proposed = 承認待ち（ダッシュボードで承認すると active）

variants:
  - name: A-原文
    status: active
    rationale: 大宮さん作成の原文（「このLINEで」をチャネルごとの表現に置換）
    subject: "【無料お試し】スマホの料理写真をプロ品質に「Menu Photo Pro」のご案内（{shop_name}さま）"
    body: |
      {greeting}

      いつもお世話になっております。オーティスの{sender_person}です。

      スマホで撮った料理写真を、プロのカメラマンが撮ったようなメニュー写真に仕上げるアプリ「Menu Photo Pro」を作りました。
      {shop_name}さんにも、ぜひ一度試していただきたくご連絡しました。

      ▼こちらから無料でお試しいただけます（アプリのインストール・会員登録は不要）
      {trial_url}

      【こんなことができます】
      ・スマホで撮った写真を選んで、ボタンを押すだけ
      ・暗い・黄ばんだ写真も、明るく自然な光と清潔感のある背景に
      ・料理・量・盛り付けはそのまま。実物と違う写真にはなりません
      ・何枚でもまとめて仕上げられます
      ・仕上がった写真から、Instagramのリールやストーリーにそのまま使える動画も作れます（無料）

      【お店にとってのメリット】
      ・カメラマンに頼まなくていい
      ・照明や撮影機材もいらない
      ・営業の合間に、スマホ1台で数分で完成
      ・新メニューや季節限定の告知、本日のおすすめ、Instagram・LINE・デリバリーアプリの写真の差し替えに、すぐ使えます

      最初にお店の名前を入れるだけで、10枚まで無料でお使いいただけます。
      気に入っていただけたら、月額1,980円（税別）から続けてご利用いただけます。

      使ってみたご感想も、{reply_channel}で気軽にお聞かせください。
      どうぞよろしくお願いいたします。

  - name: B-初回あいさつ・短め
    status: proposed
    rationale: >
      面識のない相手に「いつもお世話になっております」は不自然でスパムと受け取られやすい。
      冒頭を初回向けに変え、DMで読み切れる長さに短縮して返信率が上がるかを検証する。
    subject: "スマホの料理写真をプロ品質に（{shop_name}さま・無料お試しのご案内）"
    body: |
      {greeting}

      突然のご連絡失礼いたします。オーティスの{sender_person}です。
      {shop_name}さんの{found_via}を拝見して、ご連絡しました。

      スマホで撮った料理写真を、プロが撮ったようなメニュー写真に仕上げるアプリ「Menu Photo Pro」を作りました。

      ・写真を選んでボタンを押すだけ
      ・暗い・黄ばんだ写真も、明るく清潔感のある写真に
      ・料理・量・盛り付けはそのまま（実物と違う写真にはなりません）
      ・リールやストーリー用の動画も無料で作れます

      ▼インストール・会員登録なしで、10枚まで無料でお試しいただけます
      {trial_url}

      気に入っていただけたら、月額1,980円（税別）から続けてご利用いただけます。
      ご感想も{reply_channel}で気軽にお聞かせください。
